px 0 #8f4a10}.btn.secondary{background:#09284d;color:#fff1cd;border-color:#c79539;box-shadow:0 3px 0 #03101e}.btn.danger{background:linear-gradient(#ffb3a9,#ff6e63);border-color:#a52b22;box-shadow:0 3px 0 #8d221b;color:#430a05}.btn.ghost{background:transparent;color:inherit;box-shadow:none;border-color:#b38b50}.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:.82rem;font-weight:800;color:#55372a}.field input,.field select,.field textarea{width:100%;border:1px solid #ccb89a;border-radius:9px;padding:11px 12px;background:#fffdf8;color:#24140f;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#bc8025;box-shadow:0 0 0 3px #dfad4c35}.hint{font-size:.76rem;color:#78665c;line-height:1.5}.separator{height:1px;background:linear-gradient(90deg,transparent,#d2b37b,transparent);margin:17px 0}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:.72rem;font-weight:800;background:#fff0c6;color:#6b400f;border:1px solid #e4c271}.badge.open{background:#d9f9e8;color:#0b623c;border-color:#8bdbaf}.badge.closed{background:#ffe4e0;color:#8a201a;border-color:#f0a39b}.badge.info{background:#e0edff;color:#214e88;border-color:#a9c6ed}.candidate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:14px}.candidate-card{background:linear-gradient(#fffdf7,#f8e7c9);color:#2c1a12;border:2px solid #e6bd63;border-radius:15px;overflow:hidden;box-shadow:0 9px 22px #0003}.candidate-photo{width:100%;aspect-ratio:4/4.2;object-fit:cover;display:block;background:linear-gradient(135deg,#09284d,#31080d)}.candidate-body{padding:12px}.candidate-name{font:700 1.13rem 'Playfair Display',serif;margin:0 0 10px}.candidate-body .btn{width:100%}.progress-wrap{height:19px;background:#250a10;border:1px solid #ca8e2d;border-radius:999px;overflow:hidden;padding:2px}.progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#e77c20,#ffe780,#f5a526);transition:width .45s ease;box-shadow:0 0 10px #ffc84a88}.progress-label{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 0 7px;font-size:.83rem}.table-wrap{overflow:auto;border:1px solid #d9c39f;border-radius:12px;background:#fffdf8;color:#2b1b12}table{border-collapse:collapse;width:100%;min-width:600px;font-size:.82rem}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #eddfc7;vertical-align:middle}th{background:#f4e2c0;color:#56341a;position:sticky;top:0;z-index:1}tr:last-child td{border-bottom:0}.table-actions{display:flex;gap:6px;flex-wrap:wrap}.table-actions .btn{padding:7px 9px;font-size:.74rem}.avatar{width:44px;height:44px;object-fit:cover;border-radius:8px;border:2px solid #d4a84a;background:#09284d}.wall-page{width:min(1680px,100% - 24px);padding:12px 0 30px}.wall-page .marquee-inner{padding:20px}.wall-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px;margin-top:16px}.wall-message{font:800 clamp(2rem,5.4vw,5.4rem)/1.03 'Playfair Display',serif;text-transform:uppercase;color:#ffce5d;text-shadow:0 3px #822e0b,0 6px #0009;text-align:center}.wall-sub{text-align:center;color:#fff0cf;font-size:clamp(.95rem,1.8vw,1.35rem);margin-top:12px}.wall-progress{font-weight:900;font-size:clamp(3rem,9vw,8rem);color:#ffdc79;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 5px 0 #74300b}.wall-candidate{display:flex;align-items:center;gap:12px;border-bottom:1px solid #d3a74555;padding:10px 0}.wall-candidate img{width:62px;height:62px;object-fit:cover;border-radius:8px;border:2px solid var(--gold)}.wall-candidate strong{font:700 1.2rem 'Playfair Display',serif;color:#ffda82}.qr-holder{background:white;display:grid;place-items:center;padding:12px;border-radius:12px;width:max-content;max-width:100%;margin:12px auto}.qr-holder img{max-width:100%}.qr-url{font-size:.82rem;color:#f6e2b6;overflow-wrap:anywhere;text-align:center}.footer{text-align:center;color:#d7bba7;font-size:.75rem;margin-top:25px;line-height:1.5}.modal-backdrop{position:fixed;inset:0;background:#100206c9;z-index:100;display:grid;place-items:center;padding:16px}.modal{width:min(550px,100%);background:linear-gradient(145deg,#fff8e9,#ecd6ac);color:#2c180d;border:3px solid #d6a33c;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0009}.modal h2{font:800 1.7rem 'Playfair Display',serif;margin:0 0 8px;color:#79200f}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;max-width:min(680px,calc(100% - 24px));border:1px solid #f4c45a;border-radius:12px;background:#19090cf2;color:#fff2d2;padding:13px 16px;box-shadow:0 10px 32px #0006;font-size:.9rem}.empty{border:1px dashed #d6a64d;border-radius:12px;padding:22px;text-align:center;color:#efd9b9}.inline-check{display:flex;gap:8px;align-items:center}.inline-check input{width:auto}.notice{border-left:4px solid #d89c30;background:#fff1cb;color:#56320c;padding:12px;border-radius:8px;font-size:.84rem;line-height:1.5}.announcement-flash{margin-top:12px;border:2px solid #ffcf62;border-radius:12px;padding:12px 16px;text-align:center;background:linear-gradient(100deg,#4a0b12,#12345a,#4a0b12);color:#ffdc84;font-weight:900;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 0 22px #ffc84a55;animation:announcementFlash 1.1s ease-in-out 5}.selfie-preview{display:block;max-width:160px;max-height:160px;object-fit:cover;border-radius:12px;border:2px solid #ce9a34;margin-top:8px}.pin-input{letter-spacing:.25em}.right{text-align:right}.center{text-align:center}.big-countdown{font-size:clamp(1.5rem,4vw,3rem);font-weight:900;color:#ffda79;text-align:center}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.soft-note{border:1px solid #dfc28b;border-radius:10px;padding:10px;background:#fff6df;font-size:.8rem;color:#6c4a24;line-height:1.5}.candidate-form-image{max-width:140px;max-height:140px;object-fit:cover;border-radius:10px;border:2px solid #d0a345}.kicker{letter-spacing:.14em;text-transform:uppercase;font-weight:800;font-size:.72rem;color:#a15d16}.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}@keyframes announcementFlash{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(1.5);transform:scale(1.008)}}@media(max-width:800px){.layout,.wall-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.page{width:min(100% - 18px,1240px);padding-top:12px}.topbar{align-items:flex-start;flex-direction:column}.view-links{max-width:100%}.marquee-inner{padding:24px 12px}.panel,.panel-dark{padding:14px}.candidate-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.candidate-body{padding:9px}.candidate-name{font-size:1rem}.candidate-card .btn{font-size:.78rem;padding:10px 7px}.grid-2{grid-template-columns:1fr}}@media(max-width:390px){.candidate-grid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:9px}.hero h1{font-size:2rem}}

<body>
<div id="app" class="page"><div class="panel-dark center">Loading the live show…</div></div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="modal-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* Paste the Project URL and Publishable (or legacy anon) key from Supabase here. Never put a secret/service_role key here. */
const SUPABASE_URL = "https://wvbhhgzdzamsqfbevdpu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_AZYST7kImF3fha7AMHPNsw_voothQe4";
const VIEW = new URLSearchParams(location.search).get('view') || 'vote';
const VOTER_SESSION_KEY = 'lsv_voter_session_v1';
let sb = null, PUBLIC_STATE = null, DASH = null, voterCreds = readVoterSession(), controlSession = null;
let publicPollTimer = null, controlPollTimer = null, lastVoterKey = '', lastWallKey = '', lastAnnSeq = null, audioEnabled = false, editingCandidateId = null, editingOldPath = null, graceModalOpen = false, lastVoterStatusCheck = 0, lastVoterAnnouncementSeq = null;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moneyless = n => new Intl.NumberFormat('en-IN').format(Number(n||0));
function toast(msg,ms=4200){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.add('hidden'),ms)}
function readVoterSession(){try{return JSON.parse(sessionStorage.getItem(VOTER_SESSION_KEY)||'null')}catch{return null}}
function saveVoterSession(phone,pin){voterCreds={phone,pin};sessionStorage.setItem(VOTER_SESSION_KEY,JSON.stringify(voterCreds))}
function clearVoterSession(){voterCreds=null;sessionStorage.removeItem(VOTER_SESSION_KEY);lastVoterKey='';renderVoter()}
function formatDate(iso){if(!iso)return '—';return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function remaining(iso){if(!iso)return '—';let s=Math.max(0,Math.floor((new Date(iso).getTime()-Date.now())/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function voterUrl(){const u=new URL(location.href);u.search='?view=vote';u.hash='';return u.href}
function setMainHeader(viewLabel='LIVE EVENT'){const flash=(VIEW==='vote'&&PUBLIC_STATE&&['6 grace minutes added','Voter registration complete'].includes(PUBLIC_STATE.announcement))?`<div class="announcement-flash">✦ ${esc(PUBLIC_STATE.announcement)} ✦</div>`:'';return `<div class="topbar"><div class="brand"><div class="brand-emblem">✦</div><div><div class="brand-title">LiveShowVoting</div><div class="brand-sub">${esc(viewLabel)} · Diwali Special</div></div></div><nav class="view-links"><a class="small-link" href="?view=vote">Voter App</a><a class="small-link" href="?view=control">Organiser Control</a><a class="small-link" href="?view=wall" target="_blank" rel="noopener">LED Wall ↗</a></nav></div><section class="marquee"><div class="marquee-inner"><div class="bulbs">${'<span></span>'.repeat(25)}</div><div class="hero"><div class="eyebrow">A night of glamour · Fun · Fashion</div><h1>Diwali Fashion<br>Show</h1><p>Celebrate the stars of the evening. A grand, glittering live voting experience.</p></div><div class="gold-rule"></div></div></section>${flash}`}
function footer(){return `<div class="footer">A private event game · Not an official election or public poll.<br>LiveShowVoting · Secure show controls · Audience votes and published show results are stored separately.</div>`}
function dbReady(){return !!(window.supabase && SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('PASTE_') && SUPABASE_PUBLISHABLE_KEY.length>20 && !SUPABASE_PUBLISHABLE_KEY.includes('PASTE_'))}
function setupInstructions(){return `${setMainHeader('SETUP')}<div class="panel" style="margin-top:18px"><h2 class="section-title" style="color:#6b300e">Connect your Supabase project</h2><p>This page is ready for your project, but the public project details have not been inserted yet.</p><ol><li>Open Supabase → Project Settings → API.</li><li>Copy the <b>Project URL</b>.</li><li>Copy the <b>Publishable key</b> (or legacy <b>anon</b> key if that is what the dashboard shows).</li><li>In GitHub, edit <code>index.html</code> and replace the two <code>PASTE_…_HERE</code> values near the bottom of the file.</li></ol><div class="notice"><b>Never paste a Secret key or service_role key into this file.</b> The repository and website will be public. Only the publishable/anon key belongs here; the SQL policies protect the data.</div></div>${footer()}`}
async function rpc(name,args={}){if(!sb)throw new Error('Supabase is not configured yet.');const {data,error}=await sb.rpc(name,args);if(error)throw new Error(error.message||'The request failed.');return data}
async function publicRefresh(){if(!sb)return;try{PUBLIC_STATE=await rpc('get_public_state');if(VIEW==='vote')await refreshVoterState();if(VIEW==='wall')renderWallMaybe();if(VIEW==='control'&&controlSession){if(!isEditingAnyControlInput())await refreshDashboard();else refreshControlStatsOnly();maybeShowGracePrompt()}}catch(e){console.error(e);if(!PUBLIC_STATE)toast('Could not connect to the backend: '+e.message,7000)}}
function isEditingAnyControlInput(){const el=document.activeElement;return !!(el&&app.contains(el)&&(['INPUT','TEXTAREA','SELECT'].includes(el.tagName)||el.isContentEditable))}
async function refreshDashboard(){try{DASH=await rpc('admin_dashboard');renderControlDashboard()}catch(e){if(String(e.message).includes('Organiser access required')){controlSession=null;renderControlLogin('This Supabase account is not on the organiser allow-list yet.')}else console.error(e)}}
function refreshControlStatsOnly(){if(!DASH||!PUBLIC_STATE)return;const put=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val};put('registered-stat',PUBLIC_STATE.registered_count??DASH.registered_count??0);put('eligible-stat',PUBLIC_STATE.eligible_count??DASH.eligible_count??0);put('round-status-stat',PUBLIC_STATE.round_status||'not started');put('progress-stat',(PUBLIC_STATE.voting_percentage??0)+'%');put('round-votes-stat',PUBLIC_STATE.votes_cast??0)}
async function refreshVoterState(force=false){if(!voterCreds){renderVoterMaybe();return}if(!force&&window.VOTER_STATUS&&Date.now()-lastVoterStatusCheck<45000){renderVoterMaybe();return}try{const status=await rpc('get_voter_status',{p_phone:voterCreds.phone,p_pin:voterCreds.pin});window.VOTER_STATUS=status;lastVoterStatusCheck=Date.now();renderVoterMaybe()}catch(e){if(/log in again|incorrect|too many PIN/i.test(e.message)){clearVoterSession();toast('Please sign in again.')}else console.warn(e)}}
function voterKey(){return JSON.stringify({reg:PUBLIC_STATE?.registration_status,round:PUBLIC_STATE?.current_round_no,rstatus:PUBLIC_STATE?.round_status,cver:PUBLIC_STATE?.candidate_version,pub:PUBLIC_STATE?.published_round_no,ann:PUBLIC_STATE?.announcement_seq,v:window.VOTER_STATUS?{id:window.VOTER_STATUS.voter_id,disq:window.VOTER_STATUS.is_disqualified,v1:window.VOTER_STATUS.voted_round_1,v2:window.VOTER_STATUS.voted_round_2}:null,auth:!!voterCreds})}
function renderVoterMaybe(){const k=voterKey();if(k!==lastVoterKey){lastVoterKey=k;renderVoter()}else updateProgressBits()}
function updateProgressBits(){document.querySelectorAll('[data-progress-fill]').forEach(el=>el.style.width=(PUBLIC_STATE?.voting_percentage||0)+'%');document.querySelectorAll('[data-progress-number]').forEach(el=>el.textContent=(PUBLIC_STATE?.voting_percentage||0)+'%');document.querySelectorAll('[data-votes-cast]').forEach(el=>el.textContent=PUBLIC_STATE?.votes_cast||0);document.querySelectorAll('[data-eligible-count]').forEach(el=>el.textContent=PUBLIC_STATE?.eligible_count||0);document.querySelectorAll('[data-round-countdown]').forEach(el=>el.textContent=remaining(PUBLIC_STATE?.round_ends_at));document.querySelectorAll('[data-registration-countdown]').forEach(el=>el.textContent=remaining(PUBLIC_STATE?.registration_deadline))}
function startPublicPolling(ms){clearInterval(publicPollTimer);publicPollTimer=setInterval(()=>publicRefresh(),ms)}
function renderVoter(){if(!dbReady()){app.innerHTML=setupInstructions();return}const s=PUBLIC_STATE||{},status=window.VOTER_STATUS;
 app.className='page';
 if(voterCreds&&status){
   if(status.is_disqualified){app.innerHTML=`${setMainHeader('VOTER LOUNGE')}<div class="panel center" style="margin-top:18px"><h2 class="section-title" style="color:#912419">Registration suspended</h2><p>Your voter account has been disqualified by the organiser. Please speak to the event team.</p><button class="btn ghost" id="logout-voter">Log out</button></div>${footer()}`;bindVoterCommon();return}
   if(s.round_status==='open'&&s.current_round_no){const already=s.current_round_no===1?status.voted_round_1:status.voted_round_2;
    if(already){app.innerHTML=`${setMainHeader('VOTER LOUNGE')}<div class="panel center" style="margin-top:18px"><span class="badge open">VOTE RECORDED</span><h2 class="section-title" style="color:#7e400d;margin-top:16px">Thank you for voting, ${esc(status.name)}!</h2><p>Your vote has been recorded. You cannot vote again in this round.</p><div class="progress-label"><span>Hall voting completion</span><strong data-progress-number>${s.voting_percentage||0}%</strong></div><div class="progress-wrap"><div class="progress-fill" data-progress-fill style="width:${s.voting_percentage||0}%"></div></div><p class="hint">Votes recorded: <b data-votes-cast>${s.votes_cast||0}</b> of <b data-eligible-count>${s.eligible_count||0}</b> eligible guests.</p><div class="big-countdown" data-round-countdown>${remaining(s.round_ends_at)}</div><button class="btn ghost" id="logout-voter">Log out</button></div>${footer()}`;bindVoterCommon();return}

function bindVoterCommon(){document.getElementById('logout-voter')?.addEventListener('click',clearVoterSession)}
function normalizePhone(value){let p=String(value||'').replace(/\D/g,'');if(p.length===10)p='91'+p;return p}
async function compressImage(file,maxDim=620,quality=.76){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxDim/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{if(!blob){reject(new Error('Could not process this image.'));return}resolve(blob)},'image/webp',quality)};img.onerror=()=>reject(new Error('Could not read this image.'));img.src=URL.createObjectURL(file)})}
async function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read image.'));r.readAsDataURL(blob)})}
function previewFile(file,id){const img=document.getElementById(id);if(!img||!file)return;img.src=URL.createObjectURL(file);img.classList.remove('hidden')}
async function submitRegistration(ev){ev.preventDefault();const btn=document.getElementById('register-submit');btn.disabled=true;btn.textContent='REGISTERING…';const err=document.getElementById('register-error');err.textContent='';try{const name=document.getElementById('reg-name').value.trim();const phone=normalizePhone(document.getElementById('reg-phone').value);const pin=document.getElementById('reg-pin').value;const file=document.getElementById('reg-selfie').files?.[0];if(!file)throw new Error('Please take or choose a selfie.');if(!/^\d{10,15}$/.test(phone))throw new Error('Enter a valid phone number. Use 10 digits for India or include the country code.');if(!/^\d{6}$/.test(pin))throw new Error('PIN must be exactly 6 digits.');let blob=await compressImage(file,560,.72);let data=await blobToDataUrl(blob);if(data.length>250000){blob=await compressImage(file,450,.6);data=await blobToDataUrl(blob)}if(data.length>260000)throw new Error('Image is too large even after compression. Try another photo.');const result=await rpc('register_voter',{p_name:name,p_phone:phone,p_pin:pin,p_selfie_data:data});saveVoterSession(phone,pin);lastVoterStatusCheck=0;window.VOTER_STATUS={voter_id:result.voter_id,name:result.name,is_disqualified:false,voted_round_1:false,voted_round_2:false};toast('Registration complete. Welcome, '+result.name+'!');await publicRefresh()}catch(e){err.textContent=e.message;toast(e.message)}finally{btn.disabled=false;btn.textContent='REGISTER NOW'}}
async function submitLogin(ev){ev.preventDefault();const btn=ev.submitter;btn.disabled=true;const err=document.getElementById('login-error');err.textContent='';try{const phone=normalizePhone(document.getElementById('login-phone').value),pin=document.getElementById('login-pin').value;const result=await rpc('login_voter',{p_phone:phone,p_pin:pin});saveVoterSession(phone,pin);lastVoterStatusCheck=0;window.VOTER_STATUS={voter_id:result.voter_id,name:result.name,is_disqualified:result.is_disqualified,voted_round_1:false,voted_round_2:false};toast('Welcome back, '+result.name+'!');await publicRefresh()}catch(e){err.textContent=e.message;toast(e.message)}finally{btn.disabled=false}}
async function castVote(candidateId,btn){if(!voterCreds)return toast('Please log in again.');if(!confirm('Confirm your vote? This vote cannot be changed.'))return;const all=[...document.querySelectorAll('[data-vote-id]')];all.forEach(b=>b.disabled=true);try{await rpc('cast_vote',{p_phone:voterCreds.phone,p_pin:voterCreds.pin,p_candidate_id:candidateId});toast('Your vote has been recorded. Thank you!');lastVoterStatusCheck=0;await publicRefresh()}catch(e){toast(e.message)}finally{all.forEach(b=>b.disabled=false)}}
function resultsHtml(results){if(!results||!results.length)return '';const list=[...results].sort((a,b)=>Number(a.rank)-Number(b.rank));return `<div class="stack" style="margin-top:16px">${list.map(r=>`<div class="wall-candidate" style="background:#fff8e9;border:1px solid #e6c982;border-radius:11px;padding:10px"><span style="font-size:1.6rem;font-weight:900;color:#a24e08;width:38px;text-align:center">#${esc(r.rank)}</span><img src="${esc(r.image_url||'')}" alt="" loading="lazy"><div style="flex:1"><strong>${esc(r.display_name||'Contestant')}</strong><div class="hint">${r.is_winner?'🏆 Winner · ':''}Published score: <b>${esc(r.display_score)}</b></div></div>${r.is_winner?'<span class="badge">WINNER</span>':''}</div>`).join('')}</div>`}

bindControlActions();maybeShowGracePrompt()}
function renderVoterTable(voters){return `<div class="table-wrap"><table><thead><tr><th>Guest</th><th>Phone</th><th>R1 vote</th><th>Final vote</th><th>Status</th><th>Action</th></tr></thead><tbody>${voters.map(v=>`<tr data-voter-row data-search="${esc((v.name+' '+v.phone).toLowerCase())}"><td>${esc(v.name)}<br><span class="hint">${formatDate(v.created_at)}</span></td><td>${esc(v.phone)}</td><td>${v.voted_round_1?'Yes':'No'}</td><td>${v.voted_round_2?'Yes':'No'}</td><td>${v.is_disqualified?'<span class="badge closed">Disqualified</span>':'<span class="badge open">Eligible</span>'}</td><td><div class="table-actions"><button class="btn ghost" data-selfie-id="${esc(v.id)}">View selfie</button><button class="btn ${v.is_disqualified?'ghost':'danger'}" data-voter-toggle="${esc(v.id)}" data-disq="${v.is_disqualified?'true':'false'}">${v.is_disqualified?'Reinstate':'Disqualify'}</button></div></td></tr>`).join('')||'<tr><td colspan="6">No guests registered yet.</td></tr>'}</tbody></table></div>`}
function renderFinalistPanel(e){const r1=e.rounds.find(r=>r.round_no===1);if(!r1||r1.status!=='closed')return '';const candidates=e.candidates.filter(c=>c.is_active&&!c.is_disqualified);return `<section class="panel" style="margin-top:16px"><h2 class="section-title" style="color:#6b300e">Finalist selection</h2><p class="hint">Select the couples who advance to the final. This never deletes Round 1 votes. Publish Round 1 results after you have set your finalists.</p><div class="grid-2" id="finalist-choices">${candidates.map(c=>`<label class="inline-check" style="padding:9px;border:1px solid #e2c990;border-radius:9px"><input type="checkbox" value="${esc(c.id)}" data-finalist-check ${c.finalist?'checked':''}><img class="avatar" src="${esc(c.image_url)}" alt=""><span>${esc(c.name)}</span></label>`).join('')}</div><div class="btn-row" style="margin-top:12px"><button class="btn" id="save-finalists">SAVE FINALISTS</button></div></section>`}
function renderPublishPanels(e){return e.rounds.filter(r=>r.status==='closed').map(r=>{const candidates=e.candidates.filter(c=>c.is_active&&!c.is_disqualified&&(r.round_no===1||c.finalist));const sorted=[...candidates].sort((a,b)=>(r.round_no===1?b.round1_votes-a.round1_votes:b.round2_votes-a.round2_votes));const key=r.round_no===1?'round1_votes':'round2_votes';return `<section class="panel" style="margin-top:16px"><div class="btn-row" style="justify-content:space-between"><h2 class="section-title" style="color:#6b300e;margin:0">Round ${r.round_no} results & override</h2>${r.is_published?'<span class="badge open">PUBLISHED</span>':'<span class="badge info">NOT PUBLISHED</span>'}</div><p class="hint">Audience totals are shown for reference. Edit display rank and show score before publishing. Rank 1 becomes the displayed winner. Actual votes remain unchanged in the raw vote ledger.</p>${r.is_published?`<div class="notice">Published at ${formatDate(r.published_at)}. You can republish to correct or change the show result.</div>`:''}<div class="table-wrap" style="margin-top:10px"><table id="publish-round-${r.round_no}"><thead><tr><th>Couple</th><th>Audience votes</th><th>Published rank</th><th>Displayed show score</th></tr></thead><tbody>${sorted.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${c[key]||0}</td><td><input data-rank-candidate="${esc(c.id)}" type="number" min="1" max="100" value="${i+1}" style="width:82px;padding:7px;border:1px solid #ccb89a;border-radius:7px"></td><td><input data-score-candidate="${esc(c.id)}" type="number" min="0" max="9999" value="${c[key]||0}" style="width:100px;padding:7px;border:1px solid #ccb89a;border-radius:7px"></td></tr>`).join('')||'<tr><td colspan="4">No candidates available.</td></tr>'}</tbody></table></div><div class="btn-row" style="margin-top:12px"><button class="btn" data-publish-round="${r.round_no}" ${sorted.length?'':'disabled'}>${r.is_published?'REPUBLISH SHOW RESULTS':'PUBLISH RESULTS'}</button></div></section>`}).join('')}
function bindControlActions(){
 document.getElementById('admin-logout')?.addEventListener('click',async()=>{await sb.auth.signOut();controlSession=null;DASH=null;clearInterval(controlPollTimer);renderControlLogin('You have signed out.')});
 document.getElementById('start-registration')?.addEventListener('click',()=>doAdminAction('admin_start_registration',{},'Registration opened for 10 minutes.'));
 document.getElementById('close-registration')?.addEventListener('click',()=>{if(confirm('Close registration now? This stops new registrations immediately.'))doAdminAction('admin_close_registration',{},'Voter registration complete.')});
 document.getElementById('save-duration')?.addEventListener('click',()=>doAdminAction('admin_set_vote_duration',{p_minutes:Number(document.getElementById('vote-duration').value)},'Voting time limit saved.'));
 document.getElementById('start-round1')?.addEventListener('click',()=>{if(confirm('Open Round 1 voting now?'))doAdminAction('admin_start_round',{p_round_no:1},'Round 1 voting opened.')});
 document.getElementById('start-round2')?.addEventListener('click',()=>{if(confirm('Open final voting now? Only selected finalists will appear.'))doAdminAction('admin_start_round',{p_round_no:2},'Final voting opened.')});
 document.getElementById('close-round')?.addEventListener('click',()=>{if(confirm('Close voting lines immediately?'))doAdminAction('admin_close_round',{},'Voting lines closed.')});
 document.getElementById('copy-voter-url')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(voterUrl());toast('Voter link copied.')}catch{prompt('Copy this voter link:',voterUrl())}});
 document.getElementById('candidate-form')?.addEventListener('submit',saveCandidate);
 document.getElementById('candidate-photo')?.addEventListener('change',()=>previewFile(document.getElementById('candidate-photo').files?.[0],'candidate-photo-preview'));
 document.getElementById('cancel-candidate-edit')?.addEventListener('click',resetCandidateForm);
 document.querySelectorAll('[data-edit-candidate]').forEach(b=>b.addEventListener('click',()=>editCandidate(b.dataset.editCandidate)));
 document.querySelectorAll('[data-remove-candidate]').forEach(b=>b.addEventListener('click',async()=>{if(confirm('Remove this couple from the candidate list? Historical votes are preserved.'))await doAdminAction('admin_remove_candidate',{p_id:b.dataset.removeCandidate},'Couple removed.')}));
 document.querySelectorAll('[data-disqualify-candidate]').forEach(b=>b.addEventListener('click',async()=>{const reason=prompt('Reason (optional):','Organiser decision');if(reason!==null)await doAdminAction('admin_disqualify_candidate',{p_id:b.dataset.disqualifyCandidate,p_reason:reason||'Organiser decision'},'Couple disqualified.')}));
 document.getElementById('save-finalists')?.addEventListener('click',()=>{const ids=[...document.querySelectorAll('[data-finalist-check]:checked')].map(el=>el.value);if(!ids.length)return toast('Select at least one finalist.');doAdminAction('admin_set_finalists',{p_ids:ids},'Finalists saved.')});
 document.querySelectorAll('[data-publish-round]').forEach(b=>b.addEventListener('click',()=>publishRound(Number(b.dataset.publishRound))));
 document.querySelectorAll('[data-voter-toggle]').forEach(b=>b.addEventListener('click',async()=>{const disq=b.dataset.disq==='true';const reason=disq?null:prompt('Reason (optional):','Organiser decision');if(!disq&&reason===null)return;await doAdminAction('admin_set_voter_status',{p_voter_id:b.dataset.voterToggle,p_disqualified:!disq,p_reason:reason||'Organiser decision'},disq?'Voter reinstated.':'Voter disqualified.')}));
 document.querySelectorAll('[data-selfie-id]').forEach(b=>b.addEventListener('click',()=>showSelfie(b.dataset.selfieId)));
 document.getElementById('voter-search')?.addEventListener('input',ev=>{const term=ev.target.value.toLowerCase();document.querySelectorAll('[data-voter-row]').forEach(row=>row.classList.toggle('hidden',!row.dataset.search.includes(term)))});
}
async function doAdminAction(name,args,success){try{await rpc(name,args);toast(success);await publicRefresh();await refreshDashboard()}catch(e){toast(e.message,6500)}}
function resetCandidateForm(){editingCandidateId=null;editingOldPath=null;document.getElementById('candidate-id').value='';document.getElementById('candidate-old-path').value='';document.getElementById('candidate-name').value='';document.getElementById('candidate-order').value=String((DASH?.candidates?.length||0)+1);document.getElementById('candidate-photo').value='';document.getElementById('candidate-photo-preview').classList.add('hidden');document.getElementById('save-candidate').textContent='ADD COUPLE';document.getElementById('candidate-error').textContent=''}
function editCandidate(id){const c=DASH.candidates.find(x=>x.id===id);if(!c)return;editingCandidateId=id;editingOldPath=c.image_path;document.getElementById('candidate-id').value=id;document.getElementById('candidate-old-path').value=c.image_path;document.getElementById('candidate-name').value=c.name;document.getElementById('candidate-order').value=c.display_order;document.getElementById('candidate-photo').value='';const im=document.getElementById('candidate-photo-preview');im.src=c.image_url;im.classList.remove('hidden');document.getElementById('save-candidate').textContent='SAVE CHANGES';document.getElementById('candidate-name').focus()}
async function saveCandidate(ev){ev.preventDefault();const btn=document.getElementById('save-candidate'),err=document.getElementById('candidate-error');btn.disabled=true;err.textContent='';let uploadedPath=null;try{const id=document.getElementById('candidate-id').value||null;const name=document.getElementById('candidate-name').value.trim();const displayOrder=Number(document.getElementById('candidate-order').value||1);const file=document.getElementById('candidate-photo').files?.[0];let imageUrl=null,path=null;if(file){const blob=await compressImage(file,850,.8);const ext='webp';path='contestants/'+crypto.randomUUID()+'.'+ext;const {error:upErr}=await sb.storage.from('contestant-photos').upload(path,blob,{contentType:'image/webp',cacheControl:'3600',upsert:false});if(upErr)throw upErr;uploadedPath=path;imageUrl=sb.storage.from('contestant-photos').getPublicUrl(path).data.publicUrl}else if(id){const old=DASH.candidates.find(c=>c.id===id);imageUrl=old.image_url;path=old.image_path}else{throw new Error('Choose a couple photograph first.')}
 await rpc('admin_save_candidate',{p_id:id,p_name:name,p_image_url:imageUrl,p_image_path:path,p_display_order:displayOrder});if(id&&file&&editingOldPath){sb.storage.from('contestant-photos').remove([editingOldPath]).catch(()=>{})}toast(id?'Couple updated.':'Couple added.');resetCandidateForm();await publicRefresh();await refreshDashboard()}catch(e){err.textContent=e.message;if(uploadedPath)sb.storage.from('contestant-photos').remove([uploadedPath]).catch(()=>{});toast(e.message,6500)}finally{btn.disabled=false}}
async function publishRound(roundNo){const table=document.getElementById('publish-round-'+roundNo);if(!table)return;const ranks=[...table.querySelectorAll('[data-rank-candidate]')],scores=[...table.querySelectorAll('[data-score-candidate]')];const scoresById=new Map(scores.map(el=>[el.dataset.scoreCandidate,Number(el.value)]));const candidateById=new Map(DASH.candidates.map(c=>[c.id,c]));const results=ranks.map(el=>{const c=candidateById.get(el.dataset.rankCandidate);return {candidate_id:el.dataset.rankCandidate,display_name:c?.name||'Contestant',image_url:c?.image_url||'',rank:Number(el.value),display_score:scoresById.get(el.dataset.rankCandidate)||0,actual_votes:roundNo===1?(c?.round1_votes||0):(c?.round2_votes||0),is_winner:Number(el.value)===1}});if(results.some(x=>!Number.isInteger(x.rank)||x.rank<1||x.rank>100||!Number.isInteger(x.display_score)||x.display_score<0||x.display_score>9999))return toast('Ranks must be 1–100 and display scores 0–9999.');if(results.filter(x=>x.rank===1).length!==1)return toast('Assign rank 1 to exactly one couple—the displayed winner.');if(!confirm('Publish these SHOW results? Audience vote records will remain unchanged.'))return;await doAdminAction('admin_publish_results',{p_round_no:roundNo,p_results:results},'Results published. All guest and LED screens will update.')}
async function showSelfie(id){try{const data=await rpc('admin_get_selfie',{p_voter_id:id});document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" id="selfie-modal-backdrop"><div class="modal"><div class="btn-row" style="justify-content:space-between"><h2>Retained voter selfie</h2><button class="btn ghost" id="close-selfie">Close</button></div><img src="${data.selfie_data}" alt="Voter selfie" style="display:block;max-width:100%;max-height:65vh;margin:12px auto;border:2px solid #d1a343;border-radius:12px"><p class="hint">Visible only to an authenticated organiser inside the control panel.</p></div></div>`;document.getElementById('close-selfie').addEventListener('click',()=>document.getElementById('modal-root').innerHTML='');document.getElementById('selfie-modal-backdrop').addEventListener('click',ev=>{if(ev.target.id==='selfie-modal-backdrop')document.getElementById('modal-root').innerHTML=''})}catch(e){toast(e.message)}}
function maybeShowGracePrompt(){if(VIEW!=='control'||!DASH||!DASH.grace_prompt_shown||DASH.grace_used||DASH.grace_declined||DASH.registration_status!=='open'||graceModalOpen)return;graceModalOpen=true;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="kicker">Registration grace decision</div><h2>Need six more minutes?</h2><p>The original 10-minute registration window is nearly over or has just ended. Approving this adds six more minutes. If you do not decide within the short hold window, registration will close automatically.</p><div class="btn-row"><button class="btn" id="approve-grace">ADD 6 GRACE MINUTES</button><button class="btn danger" id="decline-grace">NO — CLOSE ON TIME</button></div></div></div>`;document.getElementById('approve-grace').addEventListener('click',async()=>{graceModalOpen=false;document.getElementById('modal-root').innerHTML='';await doAdminAction('admin_add_grace',{},'6 grace minutes added. The LED wall will announce it.')});document.getElementById('decline-grace').addEventListener('click',async()=>{graceModalOpen=false;document.getElementById('modal-root').innerHTML='';await doAdminAction('admin_decline_grace',{},'Grace extension declined.')})}
function startControlPolling(){clearInterval(controlPollTimer);controlPollTimer=setInterval(async()=>{if(VIEW==='control'&&controlSession){await publicRefresh()}},4000)}

/* LED WALL */
function renderWall(){if(!dbReady()){app.innerHTML=setupInstructions();return}app.className='page wall-page';const s=PUBLIC_STATE||{};const regOpen=s.registration_status==='open';const roundOpen=s.round_status==='open';const published=s.published_results?.length>0;let center='';if(roundOpen){center=`<div class="wall-message">${s.voting_percentage>=100?'VOTING COMPLETE':'VOTING LINES OPEN'}</div><div class="wall-sub">${esc(s.current_round_name||'Current Round')}</div><div class="wall-progress" data-progress-number>${s.voting_percentage||0}%</div><div class="progress-wrap" style="height:30px"><div class="progress-fill" data-progress-fill style="width:${s.voting_percentage||0}%"></div></div><div class="wall-sub">${s.votes_cast||0} of ${s.eligible_count||0} eligible guests have voted</div><div class="wall-sub">Time remaining <b data-round-countdown>${remaining(s.round_ends_at)}</b></div>`}else if(published&&s.published_round_no===s.current_round_no){center=`<div class="wall-message">RESULTS REVEALED</div><div class="wall-sub">Round ${s.published_round_no} · Please celebrate our stars!</div>${resultsHtml(s.published_results)}`}else if(s.registration_status==='not_started'||regOpen){center=`<div class="wall-message">${regOpen?'REGISTRATION OPEN':'JOIN THE AUDIENCE'}</div><div class="wall-sub">${regOpen?'Scan to register and get ready to vote':'Scan the QR code to open the voter app'}</div><div class="big-countdown" style="margin-top:20px" data-registration-countdown>${regOpen?remaining(s.registration_deadline):'WELCOME'}</div>`}else{center=`<div class="wall-message">${s.round_status==='closed'?'VOTING LINES CLOSED':'GET READY FOR THE SHOW'}</div><div class="wall-sub">${s.round_status==='closed'?'The organiser is preparing the official show results.':'Registration complete. Voting will open after the announcement.'}</div>`}
app.innerHTML=`<div class="topbar"><div class="brand"><div class="brand-emblem">✦</div><div><div class="brand-title">LiveShowVoting</div><div class="brand-sub">Official event display · Diwali special</div></div></div><div class="btn-row"><button class="btn secondary" id="enable-wall-audio">🔊 ENABLE ANNOUNCER SOUND</button><a class="small-link" href="?view=control" target="_blank" rel="noopener">Control panel ↗</a></div></div><section class="marquee"><div class="marquee-inner"><div class="bulbs">${'<span></span>'.repeat(35)}</div><div class="hero"><div class="eyebrow">A night of glamour · Fun · Fashion</div><h1>Diwali Fashion<br>Show</h1><p>${esc(s.event_name||'Live audience voting')}</p></div><div class="gold-rule"></div></div></section><div class="wall-grid"><section class="panel-dark center" id="wall-main" style="min-height:390px;display:flex;flex-direction:column;justify-content:center">${center}</section><aside class="panel-dark center"><h2 class="section-title">JOIN & VOTE</h2><div class="qr-holder"><div id="wall-qr"></div></div><div class="qr-url">${esc(voterUrl())}</div><div class="separator"></div><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><div class="num">${moneyless(s.registered_count||0)}</div><div class="label">Guests registered</div></div><div class="stat"><div class="num">${s.voting_percentage||0}%</div><div class="label">Voting completed</div></div></div><div class="wall-sub">${esc(s.announcement||'Welcome to the show')}</div></aside></div><div class="footer">Grand marquee atmosphere · All live numbers are updated from the event database.</div>`;
 if(window.QRCode){try{new QRCode(document.getElementById('wall-qr'),{text:voterUrl(),width:210,height:210,colorDark:'#09284d',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){document.getElementById('wall-qr').textContent='Open '+voterUrl()}}else document.getElementById('wall-qr').textContent='Open '+voterUrl();
 document.getElementById('enable-wall-audio').addEventListener('click',()=>{audioEnabled=true;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Announcer sound enabled. Welcome to the Diwali Fashion Show.');u.pitch=.65;u.rate=.9;u.volume=1;speechSynthesis.speak(u);toast('LED announcer sound enabled on this device.')}catch{toast('Speech synthesis is not available in this browser.')}});
 handleWallAnnouncement();}
function renderWallMaybe(){const s=PUBLIC_STATE||{};const key=JSON.stringify({reg:s.registration_status,round:s.current_round_no,rs:s.round_status,pub:s.published_round_no,ann:s.announcement_seq,cver:s.candidate_version,regc:s.registered_count,v:s.voting_percentage});if(key!==lastWallKey){lastWallKey=key;renderWall()}else updateProgressBits()}
function handleWallAnnouncement(){const s=PUBLIC_STATE;if(!s)return;if(lastAnnSeq===null){lastAnnSeq=s.announcement_seq;return}if(s.announcement_seq!==lastAnnSeq){lastAnnSeq=s.announcement_seq;if(audioEnabled&&'speechSynthesis'in window){const msg=s.announcement||'';const u=new SpeechSynthesisUtterance(msg);u.pitch=.62;u.rate=.88;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}}}

async function init(){if(!dbReady()){app.innerHTML=setupInstructions();return}try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){app.innerHTML=setupInstructions();return}
 if(VIEW==='control'){const {data}=await sb.auth.getSession();controlSession=data.session;if(controlSession){try{DASH=await rpc('admin_dashboard');await publicRefresh();await refreshDashboard();startControlPolling()}catch(e){controlSession=null;renderControlLogin(e.message)}}else{await publicRefresh();renderControlLogin()}startPublicPolling(4000);return}
 if(VIEW==='wall'){await publicRefresh();renderWall();startPublicPolling(5000);return}
 if(VIEW!=='vote'){app.innerHTML=`${setMainHeader('NOT FOUND')}<div class="panel" style="margin-top:18px"><h2>Screen not found</h2><a href="?view=vote">Open voter app</a></div>`;return}
 await publicRefresh();renderVoter();startPublicPolling(8000);}
init();
setInterval(updateProgressBits,1000);
</script>
</body></html>
