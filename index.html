function toast(msg,bad=false){const t=$('toast');if(!t)return;t.textContent=msg;t.style.borderColor=bad?'#ba3942':'#d2a04f';t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),4200)}
function fmtTime(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function ago(v){if(!v)return 'Never';let s=Math.max(0,Math.floor((Date.now()-new Date(v).getTime())/1000));return s<60?s+'s ago':Math.floor(s/60)+'m ago'}
function voterUrl(){const u=new URL(location.href);u.search='?view=vote';u.hash='';return u.href}
function rpc(name,args={}){if(!sb)throw new Error('Supabase is not configured. Add the public publishable/anon key in index.html.');return sb.rpc(name,args).then(({data,error})=>{if(error)throw new Error(error.message||name+' failed');return data})}
function isConfigured(){return !!(window.supabase&&SUPABASE_URL.startsWith('https://')&&SUPABASE_PUBLISHABLE_KEY.length>20&&!SUPABASE_PUBLISHABLE_KEY.includes('PASTE_'))}
function topbar(sub='LIVE PAGEANT'){return `<header class="topbar"><div class="brand"><img src="${HOWRAH_LOGO}" alt="Lions Club of Howrah logo"><div><div class="brand-title">Roshni Aur Riwaz</div><div class="brand-sub">${esc(sub)} · LiveShowVoting</div></div></div><nav class="nav"><a href="?view=vote">Audience</a><a href="?view=control">Master</a><a href="?view=judge">Judges</a><a href="?view=wall" target="_blank" rel="noopener">LED Wall ↗</a></nav></header>`}
function hero(eventName='Roshni Aur Riwaz',subtitle='The grand pageant experience'){return `<section class="hero"><div class="eyebrow">Lions Club of Howrah presents</div><h1>${esc(eventName)}</h1><p>${esc(subtitle)}</p><div class="goldline"></div><div class="hero-mini"><img src="${LCI_LOGO}" alt="Lions Clubs International"><span class="eyebrow">Riwaz · Andaz · Jalwa · Roshni</span></div></section>`}
function footer(){return `<footer class="foot">A private event voting experience · One vote per eligible guest per round · Hosted on GitHub Pages + Supabase</footer>`}
function banner(mode){return mode==='rehearsal'?`<div class="notice" style="margin:10px 0"><b>REHEARSAL MODE</b> — all activity and synthetic attendees are isolated from the live session.</div>`:mode==='live'?`<div class="notice red" style="margin:10px 0"><b>LIVE EVENT SESSION</b> — real registrations, votes and locked judge scores. Rehearsal data is separate.</div>`:''}
function statusBadge(v){const k=['open','voting','published','active','closed'].includes(v)?'ok':(['scoring','walkthrough','elimination','tally'].includes(v)?'warn':'');return `<span class="badge ${k}">${esc(String(v||'not started').replaceAll('_',' '))}</span>`}
function configScreen(){const app=$('app');app.className='wrap narrow';app.innerHTML=`${topbar('SETUP REQUIRED')}${hero()}<section class="panel"><h2>Connect your Supabase project</h2><p>The publishable key has not been inserted in this file yet. The Project URL is prefilled.</p><div class="field"><label>Project URL</label><input readonly value="${SUPABASE_URL}"></div><div class="notice red"><b>Use only the Publishable key or legacy anon/public key.</b> Never paste a Supabase secret or service_role key into public HTML or GitHub.</div><ol class="hint"><li>Open Supabase → Connect or Project Settings → API Keys.</li><li>Copy the publishable key (or legacy anon key if that is what the dashboard shows).</li><li>In GitHub, edit <code>index.html</code> and replace <code>PASTE_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE</code>.</li><li>Do not run the old setup SQL again. Apply the supplied <code>02_lsv2_backend.sql</code> migration first.</li></ol></section>${footer()}`}
async function refreshState(){STATE=await rpc('lsv2_public_state');return STATE}
async function beat(role){try{await rpc('lsv2_heartbeat',{p_client_id:CLIENT_ID,p_role:role,p_details:{view:VIEW,visible:!document.hidden,user_agent:navigator.userAgent.slice(0,100)}})}catch(e){if(VIEW!=='wall')console.debug('heartbeat:',e.message)}}
function startHeartbeat(){if(heartHandle)clearInterval(heartHandle);const role=VIEW==='control'?'control':VIEW==='judge'?'judge':VIEW==='wall'?'wall':'voter';beat(role);const interval=VIEW==='vote'?45000:12000;heartHandle=setInterval(()=>{if(!document.hidden)beat(role)},interval)}
function isTyping(){const a=document.activeElement;return !!a&&(['INPUT','TEXTAREA','SELECT'].includes(a.tagName))}
async function refreshView(){try{await refreshState();if((VIEW==='vote'||VIEW==='judge')&&isTyping())return;if(VIEW==='vote')await renderVoter();else if(VIEW==='wall')renderWall();else if(VIEW==='judge')await renderJudge();else if(VIEW==='control'&&CONTROL_AUTH){DASH=await rpc('lsv2_admin_dashboard');if(!isTyping())renderControl();} }catch(e){lastError=e.message;console.error(e);if(!STATE){$('app').innerHTML=`${topbar('CONNECTION ISSUE')}${hero()}<section class="panel"><h2>Could not load live event state</h2><div class="notice red">${esc(e.message)}</div><p class="hint">Check the published-key configuration and make sure the v2 backend migration has run successfully.</p><button class="btn" onclick="location.reload()">Retry connection</button></section>`}}}
function startPolling(){if(pollHandle)clearInterval(pollHandle);const interval=VIEW==='wall'?2200:VIEW==='vote'?10000:4000;pollHandle=setInterval(()=>{if(!document.hidden)refreshView()},interval);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshView()});if(VIEW==='control'){if(healthHandle)clearInterval(healthHandle);healthHandle=setInterval(()=>{if(!document.hidden&&CONTROL_AUTH)runHealthChecks(false,false)},30000)}}
function qrcode(el,text,size=150){if(!el)return;el.innerHTML='';try{if(window.QRCode)new QRCode(el,{text,width:size,height:size,colorDark:'#260605',colorLight:'#fffdf6',correctLevel:QRCode.CorrectLevel.M});else el.textContent=text}catch{el.textContent=text}}
function noSession(){return `<section class="panel center"><h2>Awaiting the organiser</h2><p class="muted">The master organiser has not started a rehearsal or live session yet.</p><img src="${HOWRAH_LOGO}" style="width:80px;height:80px;object-fit:contain;margin:10px auto" alt="Lions Club of Howrah"></section>`}

// AUDIENCE APP
function readVoterCreds(){try{let x=sessionStorage.getItem('lsv2-voter');return x?JSON.parse(x):null}catch{return null}}
function storeVoterCreds(phone,pin){sessionStorage.setItem('lsv2-voter',JSON.stringify({phone,pin}))}
function clearVoterCreds(){sessionStorage.removeItem('lsv2-voter');VOTER=null;renderVoter()}
async function voterLoginStatus(){const cred=readVoterCreds();if(!cred)return null;try{VOTER=await rpc('lsv2_voter_status',{p_phone:cred.phone,p_pin:cred.pin});return VOTER}catch(e){VOTER=null;return null}}
async function renderVoter(){if(!STATE) return;const app=$('app');app.className='wrap';const creds=readVoterCreds();if(!STATE.active){app.innerHTML=`${topbar('AUDIENCE VOTING')}${hero()}${noSession()}${footer()}`;return}
let voter=creds?await voterLoginStatus():null;const cand=STATE.candidates||[];const isVoting=STATE.round_status==='voting';const validVoter=voter&&voter.ok&&!voter.is_disqualified;
const voterKey=JSON.stringify({active:STATE.active,mode:STATE.mode,registration:STATE.registration_status,round:STATE.current_round_no,roundStatus:STATE.round_status,seq:STATE.state_seq,voted:voter?.voted,disq:voter?.is_disqualified,candidates:(STATE.candidates||[]).map(c=>c.id),published:(STATE.published_results||[]).length});
if(validVoter&&lastVoterRenderKey===voterKey&&$('voter-progress-percent')){ $('voter-progress-percent').textContent=(STATE.voting_percentage||0)+'%'; $('voter-progress-fill').style.width=(STATE.voting_percentage||0)+'%'; $('voter-vote-count').textContent=`${STATE.votes_cast||0} of ${STATE.eligible_count||0} eligible guests have voted.`; return; }
lastVoterRenderKey=voterKey;
let content='';if(!voter){content=`<div class="grid"><section class="panel col6"><h2>Join the audience</h2><p class="hint">Registration is open only when the organiser enables it. Use your WhatsApp number and a personal PIN. The app does not verify phone ownership with paid OTP.</p>${STATE.registration_status==='open'?`<span class="badge ok">REGISTRATION OPEN</span><form id="voter-register" class="stack" style="margin-top:12px"><div class="field"><label>Full name</label><input name="name" required minlength="2" maxlength="80" placeholder="Your name"></div><div class="field"><label>WhatsApp / mobile number</label><input name="phone" inputmode="numeric" autocomplete="tel" required minlength="10" maxlength="15" placeholder="10-digit number"></div><div class="field"><label>Create a 4–8 digit PIN</label><input name="pin" inputmode="numeric" required minlength="4" maxlength="8" pattern="[0-9]{4,8}" placeholder="PIN"></div><button class="btn" type="submit">Register for voting</button></form>`:`<div class="notice">Registration is currently ${esc(STATE.registration_status?.replaceAll('_',' ')||'not open')}. You can sign in below after registering.</div>`}</section><section class="panel col6"><h2>Already registered?</h2><form id="voter-login" class="stack"><div class="field"><label>Mobile number</label><input name="phone" inputmode="numeric" required autocomplete="tel" placeholder="Registered phone number"></div><div class="field"><label>Personal PIN</label><input name="pin" type="password" inputmode="numeric" required maxlength="8" placeholder="Your PIN"></div><button class="btn secondary" type="submit">Sign in</button></form><p class="hint">Your PIN is kept only in this browser tab's session storage. Signing out clears it.</p></section></div>`}
else if(!validVoter){content=`<section class="panel"><h2>Access unavailable</h2><div class="notice red">${esc(voter?.disqualification_reason||'This voter is not eligible in the active session, or these details belong to a different session.')}</div><button class="btn" data-act="voter-clear">Sign out / switch session</button></section>`}
else{let candidatesHtml=isVoting&&!voter.voted?`<div class="contestant-grid">${cand.map(c=>`<article class="contestant"><span class="numtag">#${esc(c.pageant_no)}</span><img src="${esc(safeUrl(c.image_url))}" alt="${esc(c.name)}" loading="lazy"><div class="contestant-body"><h3>${esc(c.name)}</h3><button class="btn" style="width:100%" data-act="cast-vote" data-id="${esc(c.id)}">Vote this couple</button></div></article>`).join('')}</div>`:'';
content=`<section class="panel" style="margin-bottom:14px"><div class="section-head"><div><div class="kicker">Welcome, ${esc(voter.name)}</div><h2 style="margin:5px 0">${esc(STATE.current_round_name||'Live pageant')}</h2></div><div>${statusBadge(STATE.round_status)} <button class="btn ghost" data-act="voter-clear">Sign out</button></div></div>${banner(STATE.mode)}${isVoting?`<div class="progress-label"><span>Audience participation</span><b id="voter-progress-percent">${STATE.voting_percentage||0}%</b></div><div class="progress"><span id="voter-progress-fill" style="width:${STATE.voting_percentage||0}%"></span></div><p class="hint" id="voter-vote-count">${STATE.votes_cast||0} of ${STATE.eligible_count||0} eligible guests have voted.</p>`:''}${voter.voted?`<div class="notice" style="margin-top:14px">Your vote has been recorded for this round. You cannot vote again in the same round. Thank you for being part of Roshni Aur Riwaz.</div>`:isVoting?`<p class="hint">Choose one couple. Your selection is final for this round.</p>`:`<div class="notice" style="margin-top:14px">${STATE.round_status==='closed'?'Voting has closed. The organiser is preparing the results.':STATE.round_status==='published'?'Results have been approved and published.':STATE.round_status==='scoring'?'Judges are scoring each couple. Voting will open automatically after all locked scores are submitted.':'Please watch the LED screen for the next step.'}</div>`}</section>${candidatesHtml?`<section class="stack"><h2 style="font-family:Georgia,serif;color:#ffe3a0">Choose your favourite</h2>${candidatesHtml}</section>`:STATE.published_results?.length?`<section class="panel"><h2>Published results</h2>${renderResultsTable(STATE.published_results)}</section>`:''}`}
app.innerHTML=`${topbar('AUDIENCE VOTING')}${hero()}${banner(STATE.mode)}${content}${footer()}`;
}
function renderResultsTable(results){return `<div class="table-wrap"><table><thead><tr><th>Rank</th><th>Couple</th><th>Judges avg</th><th>Audience votes</th><th>Combined /100</th></tr></thead><tbody>${(results||[]).map(r=>`<tr><td><b>${esc(r.show_rank)}</b></td><td><img class="mini-img" src="${esc(safeUrl(r.image_url))}" alt="" loading="lazy"><br>${esc(r.name||'')}</td><td>${Number(r.judge_average||0).toFixed(2)}</td><td>${esc(r.actual_votes||0)}</td><td><b>${Number(r.combined_score||0).toFixed(2)}</b></td></tr>`).join('')}</tbody></table></div>`}


// CONTROL PANEL
function controlLogin(message='Sign in using the existing organiser Auth account.'){$('app').className='wrap narrow';$('app').innerHTML=`${topbar('MASTER CONTROL')}${hero()}<section class="panel"><span class="badge">Private organiser access</span><h2 style="margin-top:12px">Master Control Room</h2><p class="hint">Sign in with your existing Supabase email/password organiser account. No new organiser account is needed if yours already appears in <code>public.admin_users</code>.</p>${message&&message!==''?`<div class="notice red">${esc(message)}</div>`:''}<form id="admin-login" class="stack"><div class="field"><label>Organiser email</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Enter master control</button></form></section>${footer()}`}
function healthCard(title,state,detail){const cls=state==='ok'?'ok':state==='warn'?'warn':'bad';return `<div class="health-item"><span class="health-dot ${cls}"></span><div><b>${esc(title)}</b><small>${esc(detail)}</small></div></div>`}
function healthMarkup(d){const h=HEALTH||{};const beats=d?.heartbeats||[];const online=beats.filter(b=>b.online);const judgeOnline=new Set(online.filter(b=>b.role==='judge'&&b.user_id).map(b=>b.user_id)).size;const voterOnline=online.filter(b=>b.role==='voter').length;const wallOnline=online.some(b=>b.role==='wall');return `<section class="panel" id="system-health"><div class="section-head"><div><div class="kicker">Live diagnostics</div><h2>System Health Monitor</h2><p class="hint">Last check: ${esc(h.checkedAt?fmtTime(h.checkedAt):'not run yet')}. Poll-based monitoring avoids Realtime channel limits.</p></div><button class="btn secondary" data-act="health-check">Run checks now</button></div><div class="health-grid">${healthCard('Database / public state',h.db?'ok':'bad',h.db?`Public state RPC responded in ${h.latencyMs??'—'} ms.`:'No successful public-state response.')}${healthCard('Organiser permissions',h.admin?'ok':'bad',h.admin?'Authenticated organiser dashboard RPC succeeded.':'Dashboard permission or RPC failure.')}${healthCard('Hosted contestant photos',h.photos==='ok'?'ok':h.photos==='warn'?'warn':'bad',h.photoText||'Photo load test has not completed.')}${healthCard('Judge interfaces',judgeOnline===3?'ok':judgeOnline>0?'warn':'bad',`${judgeOnline}/3 judge clients have checked in during the last 45 seconds.`)}${healthCard('Audience app',voterOnline>0?'ok':'warn',`${voterOnline} audience browser(s) have checked in during the last 45 seconds.`)}${healthCard('LED wall interface',wallOnline?'ok':'warn',wallOnline?'LED has checked in recently.':'No recent LED heartbeat. Open ?view=wall on the display computer.')}${healthCard('Current session',d?.active?'ok':'warn',d?.active?`${d.mode?.toUpperCase()} session · ${d.session_id}`:'No active rehearsal/live session.')}</div><div class="notice" style="margin-top:12px">Health checks confirm current connections and data freshness, not guaranteed capacity for 300 simultaneous devices. The simulator tests workflow and counts; a real-device spot check is still important.</div></section>`}
function roundTimeline(d){return `<div class="grid">${(d.rounds||[]).map(r=>`<section class="panel col3"><div class="kicker">Round ${r.round_no}</div><h3 style="margin:5px 0 10px;font-family:Georgia,serif;font-size:22px">${esc(r.name)}</h3>${statusBadge(r.status)}<p class="hint">${r.participant_count||0} contestants · ${r.votes_cast||0} votes · ${r.score_count||0} locked judge scores</p>${r.ends_at?`<small class="muted">Voting deadline: ${fmtTime(r.ends_at)}</small>`:''}</section>`).join('')}</div>`}
function contestantsTable(d){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Couple</th><th>Photo</th><th>Master status</th><th>Action</th></tr></thead><tbody>${(d.candidates||[]).map(c=>{let active=(d.roster||[]).find(x=>x.candidate_id===c.id)?.is_active??c.is_enabled;return `<tr><td><b>${c.pageant_no}</b></td><td>${esc(c.name)}</td><td><img class="mini-img" src="${esc(safeUrl(c.image_url))}" alt="" loading="lazy"></td><td>${active?'<span class="badge ok">Active</span>':'<span class="badge">Inactive</span>'}</td><td><div class="btn-row"><button class="btn ghost" data-act="edit-candidate" data-id="${esc(c.id)}">Edit</button><button class="btn ${active?'danger':'secondary'}" data-act="toggle-candidate" data-id="${esc(c.id)}" data-enabled="${active?'true':'false'}">${active?'Remove':'Re-add'}</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function votersPanel(d){const rows=d?.voters||[];return `<section class="panel" style="margin-top:14px"><div class="section-head"><div><div class="kicker">Guest administration</div><h2>Registered audience</h2><p class="hint">Manage eligibility and review an optional registration selfie. Disqualifying a voter excludes their votes from valid scoring; raw records remain in the audit history.</p></div><span class="badge">${rows.length} records</span></div><div class="field"><label>Search guests</label><input id="voter-search" type="search" placeholder="Search name or phone number"></div><div class="table-wrap"><table><thead><tr><th>Guest</th><th>Phone</th><th>Status</th><th>Round vote</th><th>Selfie</th><th>Action</th></tr></thead><tbody>${rows.map(v=>`<tr data-voter-row data-search="${esc((v.name+' '+v.phone).toLowerCase())}"><td><b>${esc(v.name)}</b>${v.is_simulated?'<br><span class="badge warn">SIMULATED</span>':''}</td><td>${esc(v.phone)}</td><td>${v.is_disqualified?'<span class="badge bad">Disqualified</span>':'<span class="badge ok">Eligible</span>'}</td><td>${v.voted?'Voted':'Not yet'}</td><td>${v.has_selfie?`<button class="btn ghost" data-act="show-selfie" data-id="${esc(v.id)}">View selfie</button>`:'—'}</td><td><button class="btn ${v.is_disqualified?'secondary':'danger'}" data-act="voter-toggle" data-id="${esc(v.id)}" data-disqualified="${v.is_disqualified?'true':'false'}">${v.is_disqualified?'Reinstate':'Disqualify'}</button></td></tr>`).join('')||'<tr><td colspan="6">No audience registrations yet.</td></tr>'}</tbody></table></div><p class="hint">Phone/PIN is not a verified identity: without paid OTP, the app cannot prove control of the number. Treat the list as event registration data.</p></section>`}
async function showVoterSelfie(id){const data=await rpc('lsv2_admin_get_selfie',{p_voter_id:id});if(!data?.selfie_data)throw new Error('No selfie was saved for this guest.');const modal=document.createElement('div');modal.className='modal-backdrop';modal.style.cssText='position:fixed;inset:0;z-index:9998;background:#120403dd;display:grid;place-items:center;padding:18px';modal.innerHTML=`<section class="panel" style="max-width:700px;width:100%;max-height:90vh;overflow:auto"><div class="section-head"><h2>Registration selfie</h2><button class="btn ghost" type="button" id="close-selfie-modal">Close</button></div><img src="${esc(data.selfie_data)}" alt="Guest registration selfie" style="display:block;max-width:100%;max-height:70vh;margin:auto;border-radius:12px"><p class="hint">Visible only to the authenticated organiser.</p></section>`;document.body.appendChild(modal);modal.addEventListener('click',ev=>{if(ev.target===modal||ev.target.id==='close-selfie-modal')modal.remove()})}
function roundCandidatesPanel(d){const part=STATE?.candidates||[];const rno=d.current_round_no;let cards=part.map(c=>{const rr=(d.roster||[]).find(x=>x.candidate_id===c.id)||{};let done=Number(c.score_count||0)===3;return `<article class="contestant ${STATE?.on_ramp_candidate?.id===c.id?'focus':''}"><span class="numtag">#${esc(c.pageant_no)}</span><img src="${esc(safeUrl(c.image_url))}" alt="${esc(c.name)}" loading="lazy"><div class="contestant-body"><h3>${esc(c.name)}</h3><div class="small">Votes: ${rr.votes??c.voted_count??0} · Judge locks: ${c.score_count||0}/3</div><div class="btn-row" style="margin-top:10px"><button class="btn secondary" data-act="on-ramp" data-id="${esc(c.id)}">Mark On Ramp</button>${rno>1?`<button class="btn" data-act="open-scoring" data-id="${esc(c.id)}" ${done?'disabled':''}>Open scoring</button>`:''}</div>${done?'<span class="badge ok" style="margin-top:8px">R'+rno+' SCORING DONE</span>':''}</div></article>`});return `<section class="panel" style="margin-top:14px"><div class="section-head"><div><div class="kicker">Current round operations</div><h2>${esc(STATE?.current_round_name||'No round started')}</h2><p class="hint">Mark the couple On Ramp. For ANDAZ/JALWA/ROSHNI, then open scoring. The three judges lock scores independently; voting opens automatically once every participant has three locked scores.</p></div><div>${statusBadge(d.round_status)}</div></div>${cards.length?`<div class="contestant-grid">${cards.join('')}</div>`:`<div class="notice">Start a round to see its participant roster here.</div>`}${rno===1&&d.round_status==='walkthrough'?`<div class="sep"></div><div class="notice">RIWAZ is unscored. After all couples have walked, finish the walkthrough; all active couples advance into ANDAZ.</div><button class="btn" data-act="finish-walkthrough" style="margin-top:12px">Finish RIWAZ — all active couples advance</button>`:''}${d.mode==='rehearsal'&&rno>1&&d.round_status==='scoring'?`<div class="sep"></div><div class="notice"><b>Demo shortcut:</b> fill any remaining judge-score slots with clearly synthetic rehearsal scores so you can reach voting quickly. Real LIVE sessions block this action.</div><button class="btn secondary" data-act="demo-scores" style="margin-top:12px">Auto-complete scores (REHEARSAL ONLY)</button>`:''}</section>`}
function publishPanel(d){const rno=d.current_round_no;if(!rno||d.round_status!=='closed')return '';const rName=ROUND_NAMES[rno];if(rno===1)return '';const participants=(STATE?.candidates||[]).map(c=>{const m=(d.roster||[]).find(x=>x.candidate_id===c.id)||{};return {...c,actualVotes:Number(m.votes??c.voted_count??0),jAvg:Number(m.judge_average||0),combined:Number(m.combined_score||0)}}).sort((a,b)=>b.combined-a.combined);const target=rno===2?8:rno===3?5:3;return `<section class="panel" style="margin-top:14px"><div class="section-head"><div><div class="kicker">Organiser approval required</div><h2>Round ${rno} results & ${rno===4?'podium':'advancement'} selection</h2><p class="hint">Actual scores are calculated in Supabase from the locked judge scores and valid votes. Edit displayed rank/score separately if needed. Select exactly ${target} couples. Nothing appears as published until you approve.</p></div><span class="badge warn">Not yet published</span></div><div class="notice">Formula: Judge average ÷ 10 × 70 + (couple's valid votes ÷ all valid votes in this round) × 30. Scores are out of 100. Judge scores cannot be edited after locking.</div><form id="publish-form" data-round="${rno}" data-target="${target}"><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Advance / podium</th><th>Couple</th><th>Judge avg</th><th>Votes</th><th>Combined</th><th>Shown rank</th><th>Shown score</th></tr></thead><tbody>${participants.map((c,i)=>`<tr><td><input type="checkbox" name="advance" value="${esc(c.id)}" ${i<target?'checked':''} aria-label="Select ${esc(c.name)}"></td><td><b>#${c.pageant_no} ${esc(c.name)}</b><br><small>${esc(c.id)}</small></td><td>${c.jAvg.toFixed(2)}</td><td>${c.actualVotes}</td><td><b>${c.combined.toFixed(2)}</b></td><td><input class="control" name="rank_${esc(c.id)}" type="number" min="1" max="99" value="${i+1}" style="width:74px"></td><td><input class="control" name="score_${esc(c.id)}" type="number" min="0" max="9999" step="0.01" value="${c.combined.toFixed(2)}" style="width:100px"></td></tr>`).join('')}</tbody></table></div><div class="btn-row" style="margin-top:12px"><button class="btn" type="submit">Approve & publish results</button><span class="hint">This triggers the LED elimination animation and next-round reveal.</span></div></form></section>`}

='not_started')?'disabled':''}>Start ROSHNI</button><button class="btn danger" data-act="close-voting" ${DASH.round_status!=='voting'?'disabled':''}>Manually close voting</button></div><p class="hint" style="margin-top:8px">Round 1 is the unscored walkthrough. ANDAZ, JALWA and ROSHNI require three locked scores per contestant before voting opens automatically.</p></section><section class="panel col4"><div class="kicker">Audience link</div><h2>Share the vote page</h2><div class="linkbox"><span>${esc(voterLink)}</span><button class="btn ghost" data-act="copy-link">Copy</button></div><div class="center" style="margin-top:14px"><div id="control-qr" class="wall-qr" style="display:inline-grid"></div></div><p class="hint">Use polling for broad audience monitoring; avoid opening hundreds of Realtime subscriptions.</p><div class="sep"></div><div class="kicker">Live device check-ins</div><p>${esc(healthCounts(DASH))}</p><button class="btn ghost" data-act="health-check">Run system health checks</button></section></div>

function fillCandidateForm(c){const holder=$('candidate-form-holder'),form=$('candidate-form');if(!holder||!form)return;holder.classList.remove('hidden');$('candidate-form-heading').textContent=c?'Edit contestant':'Add contestant';form.elements.id.value=c?.id||'';const rosterEntry=(DASH.roster||[]).find(x=>x.candidate_id===c?.id);form.elements.is_active.value=String(rosterEntry?rosterEntry.is_active:(c?.is_enabled??true));form.elements.pageant_no.value=c?.pageant_no??((DASH.candidates||[]).reduce((m,x)=>Math.max(m,Number(x.pageant_no)||0),0)+1);form.elements.name.value=c?.name||'';form.elements.image_url.value=c?.image_url||'';holder.scrollIntoView({behavior:'smooth',block:'start'})}
async function runHealthChecks(showToast=true,checkPhotos=true){const started=performance.now();const result={checkedAt:new Date().toISOString(),latencyMs:null,db:false,admin:false,photos:HEALTH?.photos||'warn',photoText:HEALTH?.photoText||'Photo load test has not completed.'};try{const s=await rpc('lsv2_public_state');result.db=!!s.configured;result.latencyMs=Math.round(performance.now()-started);await rpc('lsv2_heartbeat',{p_client_id:CLIENT_ID,p_role:'control',p_details:{health_check:true}});const d=await rpc('lsv2_admin_dashboard');result.admin=true;if(checkPhotos){const urls=[...new Set((d.candidates||[]).filter(c=>c.is_enabled).map(c=>safeUrl(c.image_url)).filter(Boolean))];let passed=0;const checks=await Promise.all(urls.map(url=>new Promise(resolve=>{const im=new Image();let done=false;const finish=v=>{if(done)return;done=true;resolve(v)};im.onload=()=>finish(true);im.onerror=()=>finish(false);im.src=url;setTimeout(()=>finish(false),6500)})));passed=checks.filter(Boolean).length;result.photos=passed===urls.length?'ok':passed>0?'warn':'bad';photoHealth=result.photos;result.photoText=`${passed}/${urls.length} hosted images loaded from this browser during the last check.`;}HEALTH=result;DASH=d;if(showToast)toast('System checks finished. Review the health panel.');if(!isTyping()&&VIEW==='control')renderControl()}catch(e){result.db=false;result.admin=false;result.photoText=e.message;HEALTH=result;photoHealth='bad';if(showToast)toast('Health check failed: '+e.message,true);if(!isTyping()&&VIEW==='control'&&DASH)renderControl()}}

function wallHolding(){return `<div class="wall-kicker">Lions Club of Howrah proudly presents</div><h1 class="wall-heading" style="font-size:clamp(40px,7vw,110px)">ROSHNI<br>AUR RIWAZ</h1><div class="wall-subtitle">A celebration of tradition · glamour · togetherness</div><div class="goldline" style="width:65%"></div><div class="wall-subtitle">RIWAZ · ANDAZ · JALWA · ROSHNI</div>`}
function updateWallProgress(){const p=$('wall-progress');const f=$('wall-progress-fill');const n=$('wall-participation');if(p)p.textContent=(STATE?.voting_percentage||0)+'%';if(f)f.style.width=(STATE?.voting_percentage||0)+'%';if(n)n.textContent=`${STATE?.votes_cast||0} of ${STATE?.eligible_count||0} eligible guests`; }
function wallClosedContent(){return `<div class="wall-kicker">${esc(STATE.current_round_name||'CURRENT ROUND')}</div><h1 class="wall-heading">100% VOTING DONE</h1><div class="wall-subtitle">VOTING LINES CLOSED</div><div class="progress wall-close-progress" style="width:85%;height:clamp(18px,2.5vw,30px);margin:20px auto"><span style="width:100%"></span></div><div class="wall-subtitle">Turnout has been recorded. Results are being tallied.</div>`}
function renderWall(){if(!STATE)return;const app=$('app');app.className='wall';let stage=STATE.screen_mode||'holding';if((lastWallStage==='voting_open'||lastWallStage==='voting'||lastWallStage==='')&&(stage==='tally'||STATE.round_status==='closed')){wallClosureUntil=Date.now()+1800;if(wallClosureTimer)clearTimeout(wallClosureTimer);wallClosureTimer=setTimeout(()=>{lastWallRenderKey=null;renderWall()},1850)}lastWallStage=stage;const closureAnim=(Date.now()<wallClosureUntil&&(stage==='tally'||STATE.round_status==='closed'));const renderKey=JSON.stringify({active:STATE.active,mode:STATE.mode,seq:STATE.state_seq,round:STATE.current_round_no,roundStatus:STATE.round_status,screen:STATE.screen_mode,announce:STATE.announcement,ramp:STATE.on_ramp_candidate?.id,closureAnim,results:(STATE.published_results||[]).map(x=>[x.candidate_id,x.is_advance,x.show_rank])});if(lastWallRenderKey===renderKey&&$('wall-main')){updateWallProgress();return;}lastWallRenderKey=renderKey;let content='';if(closureAnim)content=wallClosedContent();else if(stage==='on_ramp'||stage==='scoring')content=onRampContent();else if(stage==='voting_open'||STATE.round_status==='voting')content=wallVoting();else if(stage==='tally'||STATE.round_status==='closed')content=wallTally();else if(stage==='elimination')content=wallElimination();else if(stage==='advancers')content=wallAdvancers();else if(stage==='podium')content=wallPodium();else if(stage==='holding'&&STATE.round_status==='walkthrough'&&STATE.on_ramp_candidate)content=onRampContent();else content=wallHolding();
app.innerHTML=`<div class="wall-head"><div class="wall-brand"><img src="${HOWRAH_LOGO}" alt="Lions Club of Howrah"><div><div class="wall-title">ROSHNI AUR RIWAZ</div><div class="wall-tag">The grand pageant experience</div></div></div><button class="fullscreen-btn" data-act="fullscreen">⛶ FULL SCREEN</button></div><section class="wall-stage"><main id="wall-main" class="wall-main">${content}<div class="event-watermark">Lions Club of Howrah</div></main>${wallQrSidebar()}</section><div class="wall-bottom"><span>${STATE.mode==='rehearsal'?'REHEARSAL · SIMULATED DATA':'LIVE EVENT DISPLAY'} · State #${STATE.state_seq||0}</span><span>${esc(STATE.announcement||'')}</span></div>`;
qrcode($('wall-qr'),voterUrl(),132);
if(stage==='elimination'&&lastEliminationSeq!==STATE.state_seq){lastEliminationSeq=STATE.state_seq;playElimination(STATE.state_seq,(STATE.published_results||[]).length)}else if(stage!=='elimination'){if(eliminationTimer&&eliminationTimer.handle)clearTimeout(eliminationTimer.handle);eliminationTimer=null;lastEliminationSeq=null}
}
async function playElimination(seq,count){if(count<1)return;let i=0;const main=$('wall-main');const tick=async()=>{if(!STATE||STATE.screen_mode!=='elimination'||Number(STATE.state_seq)!==Number(seq))return;eliminationTimer={index:i};const cards=main?.querySelectorAll('.wall-gallery .contestant');const row=(STATE.published_results||[])[i];if(cards&&cards[i]){if(row&&!row.is_advance)cards[i].classList.add('eliminated');cards[i].classList.add('focus');setTimeout(()=>cards[i]?.classList.remove('focus'),500)}i++;if(i<count){eliminationTimer.handle=setTimeout(tick,1300)}else{eliminationTimer.handle=setTimeout(async()=>{try{await rpc('lsv2_led_transition',{p_expected_seq:seq});await refreshView()}catch(e){console.warn(e)}},1300)}};eliminationTimer={index:0,handle:setTimeout(tick,700)}}

// EVENTS
async function login(email,password){const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;return data}
async function logout(){await sb.auth.signOut();CONTROL_AUTH=false;JUDGE_AUTH=false;DASH=null;renderView()}
async function renderView(){if(VIEW==='wall'){await refreshState();renderWall();return}await refreshView()}
document.addEventListener('submit',async ev=>{const form=ev.target;if(!form.id)return;ev.preventDefault();try{
 if(form.id==='admin-login'){const fd=new FormData(form);await login(fd.get('email'),fd.get('password'));await rpc('lsv2_admin_dashboard');CONTROL_AUTH=true;DASH=await rpc('lsv2_admin_dashboard');toast('Organiser signed in.');renderControl()}
 else if(form.id==='judge-login'){const fd=new FormData(form);await login(fd.get('email'),fd.get('password'));const j=await rpc('lsv2_judge_state');JUDGE_AUTH=true;toast('Judge signed in as '+j.judge_name);renderJudge()}
 else if(form.id==='voter-register'){const fd=new FormData(form);const data=await rpc('lsv2_register_voter',{p_name:fd.get('name'),p_phone:fd.get('phone'),p_pin:fd.get('pin'),p_selfie_data:null});storeVoterCreds(String(fd.get('phone')),String(fd.get('pin')));toast('Registration complete. Welcome, '+data.name);await refreshView()}
 else if(form.id==='voter-login'){const fd=new FormData(form);const st=await rpc('lsv2_voter_status',{p_phone:fd.get('phone'),p_pin:fd.get('pin')});storeVoterCreds(String(fd.get('phone')),String(fd.get('pin')));VOTER=st;toast('Signed in successfully.');await refreshView()}
 else if(form.id==='candidate-form'){const fd=new FormData(form);const id=fd.get('id')||null;await rpc('lsv2_admin_save_candidate',{p_id:id,p_pageant_no:Number(fd.get('pageant_no')),p_name:fd.get('name'),p_image_url:fd.get('image_url'),p_is_active:String(fd.get('is_active'))!=='false'});toast('Contestant saved.');DASH=await rpc('lsv2_admin_dashboard');STATE=await rpc('lsv2_public_state');renderControl()}
 else if(form.id==='sim-form'){const fd=new FormData(form);await rpc('lsv2_admin_simulate_audience',{p_total:Number(fd.get('total')),p_voted:Number(fd.get('voted'))});toast('Synthetic audience generated in rehearsal.');DASH=await rpc('lsv2_admin_dashboard');STATE=await rpc('lsv2_public_state');renderControl()}
 else if(form.id==='announcement-form'){const fd=new FormData(form);await rpc('lsv2_admin_set_announcement',{p_text:fd.get('text')});toast('LED announcement updated.');DASH=await rpc('lsv2_admin_dashboard');STATE=await rpc('lsv2_public_state');renderControl()}
 else if(form.id==='score-form'){const fd=new FormData(form);if(!confirm('Confirm score '+fd.get('score')+'/10? This cannot be changed after locking.'))return;await rpc('lsv2_judge_lock_score',{p_round_no:Number(form.dataset.round),p_candidate_id:form.dataset.candidate,p_score:Number(fd.get('score'))});toast('Score confirmed and locked.');await refreshView()}
 else if(form.id==='publish-form'){const rno=Number(form.dataset.round),target=Number(form.dataset.target);const checked=[...form.querySelectorAll('input[name="advance"]:checked')].map(x=>x.value);if(checked.length!==target)throw new Error(`Select exactly ${target} couples. You have selected ${checked.length}.`);const rows=[...form.querySelectorAll('tbody tr')].map(tr=>{const cb=tr.querySelector('input[name="advance"]');if(!cb)return null;const id=cb.value;return {candidate_id:id,show_rank:Number(form.elements['rank_'+id].value),show_score:Number(form.elements['score_'+id].value)}}).filter(Boolean);if(!confirm(`Publish the approved ${ROUND_NAMES[rno]} results and start the LED elimination/reveal animation? Actual votes and judge scores remain stored separately.`))return;await rpc('lsv2_admin_publish_round',{p_round_no:rno,p_display_results:rows,p_advance_ids:checked});toast('Results published. LED reveal has started.');DASH=await rpc('lsv2_admin_dashboard');STATE=await rpc('lsv2_public_state');renderControl()}
 }catch(e){toast(e.message||'Action failed.',true);console.error(e)}
});
document.addEventListener('click',async ev=>{const btn=ev.target.closest('[data-act]');if(!btn)return;const act=btn.dataset.act;try{
 if(act==='logout'){await logout();return}
 if(act==='voter-clear'){clearVoterCreds();return}
 if(act==='cast-vote'){const c=STATE.candidates.find(x=>x.id===btn.dataset.id);const cred=readVoterCreds();if(!cred||!c)throw new Error('Please sign in again.');if(!confirm(`Cast your one vote for #${c.pageant_no} ${c.name}? You cannot change it afterwards.`))return;await rpc('lsv2_cast_vote',{p_phone:cred.phone,p_pin:cred.pin,p_candidate_id:c.id});toast('Your vote was recorded.');await refreshView();return}
 if(act==='start-session'){const mode=btn.dataset.mode;let msg=mode==='live'?'Start a fresh LIVE session? The active session will be archived. This starts with zero live voters, votes, scores and published results.': 'Start a REHEARSAL session? The active session will be archived. Any rehearsal data remains isolated.';if(!confirm(msg))return;await rpc('lsv2_admin_start_session',{p_mode:mode});DASH=await rpc('lsv2_admin_dashboard');STATE=await rpc('lsv2_public_state');toast(mode==='live'?'Fresh live session started.':'Rehearsal session started.');renderControl();return}
 if(act==='start-registration'){await rpc('lsv2_admin_start_registration');toast('Registration is open for 10 minutes.');}
 else if(act==='add-grace'){await rpc('lsv2_admin_add_grace');toast('Six minutes of grace time added.');}
 else if(act==='close-registration'){if(!confirm('Close audience registration now?'))return;await rpc('lsv2_admin_close_registration');toast('Registration closed.');}
 else if(act==='start-round'){let n=Number(btn.dataset.round);if(!confirm(`Start Round ${n} — ${ROUND_NAMES[n]}?`))return;await rpc('lsv2_admin_start_round',{p_round_no:n});toast(ROUND_NAMES[n]+' started.');}
 else if(act==='finish-walkthrough'){if(!confirm('Mark RIWAZ complete and advance all active contestants into ANDAZ?'))return;await rpc('lsv2_admin_finish_walkthrough');toast('RIWAZ complete. All active couples advance.');}
 else if(act==='on-ramp'){await rpc('lsv2_admin_set_on_ramp',{p_candidate_id:btn.dataset.id});toast('Contestant marked On Ramp; LED updated.');}
 else if(act==='open-scoring'){await rpc('lsv2_admin_open_scoring',{p_candidate_id:btn.dataset.id});toast('Scoring opened on all judge interfaces.');}
 else if(act==='close-voting'){if(!confirm('Close voting lines now? The LED will show results being tallied.'))return;await rpc('lsv2_admin_close_round');toast('Voting closed.');}
 else if(act==='demo-scores'){if(!confirm('Generate synthetic judge scores for any remaining contestants in this rehearsal only?'))return;await rpc('lsv2_admin_demo_complete_scores');toast('Synthetic rehearsal scores generated.');}
 else if(act==='save-vote-minutes'){await rpc('lsv2_admin_set_vote_minutes',{p_minutes:Number($('vote-minutes').value)});toast('Voting duration saved.');}
 else if(act==='copy-link'){await navigator.clipboard.writeText(voterUrl());toast('Audience link copied.');return}
 else if(act==='new-candidate'){fillCandidateForm(null);return}
 else if(act==='edit-candidate'){const c=(DASH.candidates||[]).find(x=>x.id===btn.dataset.id);fillCandidateForm(c);return}
 else if(act==='cancel-candidate'){$('candidate-form-holder')?.classList.add('hidden');return}
 else if(act==='toggle-candidate'){const active=btn.dataset.enabled==='true';const c=(DASH.candidates||[]).find(x=>x.id===btn.dataset.id);if(!c)throw new Error('Contestant not found.');if(!confirm((active?'Remove ':'Re-add ')+c.name+' from this session?'))return;await rpc('lsv2_admin_set_contestant_active',{p_candidate_id:c.id,p_is_active:!active});toast(active?'Contestant removed from active roster.':'Contestant re-added.');}
 else if(act==='voter-toggle'){const currently=btn.dataset.disqualified==='true';let reason=null;if(!currently){reason=prompt('Reason for disqualification (optional):','Organiser decision');if(reason===null)return;}await rpc('lsv2_admin_set_voter_status',{p_voter_id:btn.dataset.id,p_disqualified:!currently,p_reason:reason});toast(currently?'Voter reinstated.':'Voter disqualified from valid totals.');}
 else if(act==='show-selfie'){await showVoterSelfie(btn.dataset.id);return}
 else if(act==='health-check'){await runHealthChecks(true);return}
 else if(act==='choose-score'){const form=btn.closest('form');if(!form)return;form.elements.score.value=btn.dataset.score;$('score-readout').textContent=btn.dataset.score;form.querySelectorAll('[data-act="choose-score"]').forEach(b=>b.classList.toggle('selected',b===btn));return}
 else if(act==='fullscreen'){if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.();return}
 else return;
 if(VIEW==='control'){DASH=await rpc('lsv2_admin_dashboard');STATE=await rpc('lsv2_public_state');if(!isTyping())renderControl()}
}catch(e){toast(e.message||'Action failed.',true);console.error(e)}});

document.addEventListener('input',ev=>{if(ev.target.matches('#voter-search')){const term=ev.target.value.toLowerCase();document.querySelectorAll('[data-voter-row]').forEach(row=>row.classList.toggle('hidden',!row.dataset.search.includes(term)))}if(ev.target.matches('#score-form input[name="score"]')){document.querySelectorAll('[data-act="choose-score"]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.score)===Number(ev.target.value)))}});
async function init(){const splash=$('splash');if(VIEW==='wall')splash?.classList.add('out');else setTimeout(()=>splash?.classList.add('out'),1250);if(!isConfigured()){configScreen();return}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 if(VIEW==='control'){const s=await sb.auth.getSession();if(s.data.session){try{DASH=await rpc('lsv2_admin_dashboard');CONTROL_AUTH=true;STATE=await rpc('lsv2_public_state')}catch(e){CONTROL_AUTH=false;controlLogin(e.message)}}else{controlLogin('Sign in using the existing organiser account.');}}
 else if(VIEW==='judge'){/* renderJudge checks auth and judge mapping */}
 else if(!['vote','wall','judge'].includes(VIEW)){VIEW='vote'}
 await refreshView();startHeartbeat();startPolling();
}
init().catch(e=>{console.error(e);$('app').innerHTML=`${topbar('CONNECTION ERROR')}${hero()}<section class="panel"><div class="notice red">${esc(e.message)}</div></section>`});
</script></body></html>
